<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" shape-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Đại dương: sáng ở phía mặt trời (trên-trái), tối dần sang đêm -->
    <radialGradient id="ocean" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#6fc3ff"/>
      <stop offset="35%" stop-color="#1f7fe0"/>
      <stop offset="70%" stop-color="#0b3f9c"/>
      <stop offset="100%" stop-color="#031538"/>
    </radialGradient>

    <!-- Bóng đêm (terminator) -->
    <radialGradient id="shade" cx="32%" cy="28%" r="85%">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="80%" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.92"/>
    </radialGradient>

    <!-- Quầng khí quyển -->
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#5cb8ff" stop-opacity="0"/>
      <stop offset="93%" stop-color="#6fd0ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#9be3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Ánh sáng phản chiếu -->
    <radialGradient id="spec" cx="30%" cy="24%" r="22%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Lục địa -->
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fd16a"/>
      <stop offset="55%" stop-color="#3f9a3c"/>
      <stop offset="100%" stop-color="#a9874a"/>
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff6c8"/>
      <stop offset="45%" stop-color="#FDB813"/>
      <stop offset="100%" stop-color="#FDB813" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <clipPath id="globe"><circle cx="50" cy="50" r="33"/></clipPath>
  </defs>

  <!-- Vầng sáng ngoài -->
  <circle cx="50" cy="50" r="42" fill="url(#atmo)"/>

  <!-- Nửa sau của quỹ đạo -->
  <path d="M6 58 A46 14 -18 0 1 94 42" fill="none" stroke="#7fb4ff" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>

  <!-- Hành tinh -->
  <g clip-path="url(#globe)">
    <rect x="17" y="17" width="66" height="66" fill="url(#ocean)"/>

    <!-- Lục địa -->
    <g fill="url(#land)">
      <path d="M26 34 C30 27 40 26 45 30 C48 33 44 38 46 42 C48 47 42 52 38 50 C34 48 33 43 29 42 C25 41 23 38 26 34 Z"/>
      <path d="M52 52 C58 49 66 52 68 58 C70 64 63 72 58 76 C54 79 51 73 52 68 C53 63 48 56 52 52 Z"/>
      <path d="M60 28 C66 26 74 30 76 36 C77 41 70 42 66 40 C62 38 56 32 60 28 Z"/>
    </g>
    <!-- Băng ở cực -->
    <ellipse cx="50" cy="16" rx="16" ry="5" fill="#eaf6ff" opacity="0.85"/>
    <ellipse cx="50" cy="85" rx="14" ry="4" fill="#eaf6ff" opacity="0.7"/>

    <!-- Mây -->
    <g fill="#fff" opacity="0.8" filter="url(#soft)">
      <path d="M22 46 C30 41 40 44 48 41 C54 39 58 42 52 45 C44 49 32 48 22 46 Z"/>
      <path d="M48 62 C56 58 68 61 76 57 C80 56 80 59 75 62 C67 66 55 65 48 62 Z"/>
      <path d="M30 62 C34 59 40 60 42 62 C40 65 33 65 30 62 Z"/>
      <path d="M55 24 C61 22 68 24 72 23 C70 26 62 27 55 24 Z"/>
    </g>

    <!-- Đổ bóng + phản quang -->
    <rect x="17" y="17" width="66" height="66" fill="url(#shade)"/>
    <circle cx="50" cy="50" r="33" fill="url(#spec)"/>
  </g>

  <!-- Viền khí quyển sắc nét -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#8fdcff" stroke-width="1" opacity="0.7"/>

  <!-- Nửa trước của quỹ đạo -->
  <path d="M94 42 A46 14 -18 0 1 6 58" fill="none" stroke="#9cc6ff" stroke-width="1.4" opacity="0.8" stroke-linecap="round"/>

  <!-- Vệ tinh / mặt trời nhỏ phát sáng trên quỹ đạo -->
  <circle cx="86" cy="39" r="7" fill="url(#sun)"/>
  <circle cx="86" cy="39" r="3" fill="#FDB813"/>
</svg>
