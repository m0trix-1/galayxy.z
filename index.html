<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Explorer - Interactive Universe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Inter', system-ui, sans-serif; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        
        .loading {
            position: fixed; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 20px; z-index: 1000;
            color: white; transition: opacity 0.5s;
        }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4f8ef7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .ui {
            position: fixed; top: 20px; left: 20px;
            color: white; z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ui h1 { font-size: 18px; margin-bottom: 5px; }
        .ui p { font-size: 12px; opacity: 0.7; }
        
        .controls {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            color: white; z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Initializing Cosmic Explorer...</div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="ui">
        <h1>🌌 Cosmic Explorer</h1>
        <p>Interactive Universe Simulation</p>
    </div>
    
    <div class="controls">
        Drag to rotate • Scroll to zoom • Right-click to pan
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1e20);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('canvas'),
            antialias: true,
            logarithmicDepthBuffer: true
        });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        // Camera controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.1;
        controls.maxDistance = 1e15;
        
        camera.position.set(0, 50, 150);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
        scene.add(ambientLight);
        
        const sunLight = new THREE.PointLight(0xffffff, 2, 0, 0);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Create Sun
        const sunGeometry = new THREE.SphereGeometry(5, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xFDB813,
            emissive: 0xFDB813,
            emissiveIntensity: 1
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Create Planets
        const planets = [];
        const planetData = [
            { name: 'Mercury', distance: 20, size: 0.5, color: 0x8c7851, speed: 0.04 },
            { name: 'Venus', distance: 30, size: 0.8, color: 0xe6c87f, speed: 0.03 },
            { name: 'Earth', distance: 45, size: 1, color: 0x4f8ef7, speed: 0.02 },
            { name: 'Mars', distance: 60, size: 0.7, color: 0xc1440e, speed: 0.015 },
            { name: 'Jupiter', distance: 90, size: 3, color: 0xd8ca9d, speed: 0.008 },
            { name: 'Saturn', distance: 120, size: 2.5, color: 0xe3d9b0, speed: 0.006, rings: true },
        ];

        planetData.forEach(data => {
            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            const material = new THREE.MeshStandardMaterial({ 
                color: data.color,
                roughness: 0.7,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(geometry, material);
            
            // Add Saturn's rings
            if (data.rings) {
                const ringGeometry = new THREE.RingGeometry(data.size * 1.2, data.size * 2, 64);
                const ringMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xC4B9A0, 
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.6
                });
                const rings = new THREE.Mesh(ringGeometry, ringMaterial);
                rings.rotation.x = -Math.PI / 2;
                mesh.add(rings);
            }
            
            scene.add(mesh);
            
            // Orbit line
            const orbitGeometry = new THREE.RingGeometry(data.distance - 0.1, data.distance + 0.1, 128);
            const orbitMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x444444, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.3
            });
            const orbit = new THREE.Mesh(orbitGeometry, orbitMaterial);
            orbit.rotation.x = -Math.PI / 2;
            scene.add(orbit);
            
            planets.push({ mesh, data, angle: Math.random() * Math.PI * 2 });
        });

        // Create Asteroid Belt
        const asteroidCount = 1000;
        const asteroidGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(asteroidCount * 3);
        const sizes = new Float32Array(asteroidCount);
        
        for (let i = 0; i < asteroidCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = 70 + Math.random() * 20; // Between Mars and Jupiter
            const y = (Math.random() - 0.5) * 4;
            
            positions[i * 3] = Math.cos(angle) * distance;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = Math.sin(angle) * distance;
            sizes[i] = Math.random() * 2 + 0.5;
        }
        
        asteroidGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        asteroidGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        
        const asteroidMaterial = new THREE.PointsMaterial({ 
            color: 0x8B7355,
            size: 0.5,
            transparent: true,
            opacity: 0.8
        });
        
        const asteroids = new THREE.Points(asteroidGeometry, asteroidMaterial);
        scene.add(asteroids);

        // Create Stars Background
        const starCount = 10000;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        const starColors = new Float32Array(starCount * 3);
        
        for (let i = 0; i < starCount; i++) {
            const radius = 1000 + Math.random() * 9000;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i * 3 + 2] = radius * Math.cos(phi);
            
            const brightness = 0.5 + Math.random() * 0.5;
            starColors[i * 3] = brightness;
            starColors[i * 3 + 1] = brightness;
            starColors[i * 3 + 2] = brightness;
        }
        
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        
        const starMaterial = new THREE.PointsMaterial({ 
            size: 2,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            sizeAttenuation: false
        });
        
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // Rotate planets
            planets.forEach(planet => {
                planet.angle += planet.data.speed * 0.01;
                planet.mesh.position.x = Math.cos(planet.angle) * planet.data.distance;
                planet.mesh.position.z = Math.sin(planet.angle) * planet.data.distance;
                planet.mesh.rotation.y += 0.01;
            });
            
            // Rotate asteroids
            asteroids.rotation.y += 0.0002;
            
            // Rotate stars slowly
            stars.rotation.y += 0.00001;
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Hide loading screen
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 1000);

        // Start animation
        animate();
    </script>
</body>
</html>
